[package]
name = "typr"
version = "1.3.0"
description = "A dictation app powered by Whisper"
authors = ["you"]
edition = "2021"

[lib]
name = "typr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
arboard = "3"
log = "0.4"
base64 = "0.22"
sys-locale = "0.3"

# Local speech recognition: transcribe.cpp is loaded at run time from its
# official prebuilt bundle (downloaded on demand), so nothing native is
# compiled here. Downloads are verified, the tar.gz bundle unpacked.
libloading = "0.8"
futures-util = "0.3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

# Native recording overlay (layered window drawn without a WebView), the
# keyboard state check for the hotkey and the GPU list for local recognition
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
